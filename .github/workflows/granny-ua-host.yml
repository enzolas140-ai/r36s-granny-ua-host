name: Build Granny UA Host (ARM64)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout host source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 runtime and ua_host
        shell: bash
        run: ARCH=arm64 runtime/build.sh
      - name: Test Granny dual-touch evdev bridge
        shell: bash
        run: |
          gcc -std=gnu11 -O2 -Wall -Wextra -I runtime/host -I runtime/jni runtime/host/granny_touch.c runtime/host/test/test_granny_touch.c -o /tmp/test_granny_touch
          /tmp/test_granny_touch
      - name: Test pointer, cursor drawing and GL state preservation
        shell: bash
        run: ARCH=arm64 runtime/host/test/granny_pointer_test.sh
      - name: Verify ARM64 host
        shell: bash
        run: |
          test -x runtime/host/out/arm64/ua_host
          file runtime/host/out/arm64/ua_host
          readelf -h runtime/host/out/arm64/ua_host | grep -E 'Class:|Machine:'
      - name: Package Granny host build
        shell: bash
        run: |
          mkdir -p dist/granny
          cp runtime/host/out/arm64/ua_host dist/granny/ua_host64
          cp ports/Granny.sh dist/Granny.sh
          cp ports/granny/granny-pointer.env dist/granny/granny-pointer.env
          cp ports/granny/granny_hotkey.gptk dist/granny/granny_hotkey.gptk
          cp ports/granny/README.md dist/granny/README.md
          cp LICENSE dist/LICENSE
          cp THIRD_PARTY.md dist/THIRD_PARTY.md
          cp -R runtime/media/out/arm64/licenses dist/media-licenses
          tar -czf granny-ua-host64-arm64.tar.gz -C dist .
      - name: Upload ARM64 host artifact
        uses: actions/upload-artifact@v4
        with:
          name: granny-ua-host64-arm64
          path: granny-ua-host64-arm64.tar.gz
          if-no-files-found: error